_schema-version: "3.1"
ID: sap-presales-demos-repo
description: SAP Analytics Presales Demo Repository
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - rm -f srv/csn.json
        - npx cds build
        - cp gen/srv/srv/csn.json srv/csn.json
        - npm ci --prefix ui
        - npm run build --prefix ui
        - npm ci --prefix srv --production

modules:

  # ── Express API + React SPA ───────────────────────────────────────────────────
  - name: sap-presales-demos-srv
    type: nodejs
    path: srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
      ignore:
        - node_modules/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap-presales-demos-auth
      - name: sap-presales-demos-db
      - name: sap-presales-demos-objectstore

  # ── HANA DB Deployer ──────────────────────────────────────────────────────────
  - name: sap-presales-demos-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      memory: 128M
      disk-quota: 256M
    requires:
      - name: sap-presales-demos-db

  # ── App Router ────────────────────────────────────────────────────────────────
  - name: sap-presales-demos-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sap-presales-demos-auth

resources:

  # ── XSUAA ────────────────────────────────────────────────────────────────────
  - name: sap-presales-demos-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-presales-demos-repo-${org}-${space}
        tenant-mode: dedicated

  # ── HANA Cloud HDI Container ─────────────────────────────────────────────────
  - name: sap-presales-demos-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: sap-presales-demos-repo

  # ── Object Store (S3) ────────────────────────────────────────────────────────
  - name: sap-presales-demos-objectstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: objectstore
      service-plan: s3-standard
      service-name: sap-presales-demos-objectstore
