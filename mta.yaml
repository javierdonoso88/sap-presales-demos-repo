_schema-version: "3.1"
ID: sap-presales-demos-repo
description: SAP Analytics Presales Demo Repository
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ── CAP Service ──────────────────────────────────────────────────────────────
  - name: sap-presales-demos-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap-presales-demos-auth
      - name: sap-presales-demos-db   # requiere HANA Cloud - descomentar cuando esté disponible

  # ── HANA DB Deployer (requiere instancia HANA Cloud) ─────────────────────────
  - name: sap-presales-demos-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sap-presales-demos-db

  # ── App Router (autenticación XSUAA) ─────────────────────────────────────────
  - name: sap-presales-demos-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sap-presales-demos-auth

resources:

  # ── XSUAA ────────────────────────────────────────────────────────────────────
  - name: sap-presales-demos-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-presales-demos-repo-${org}-${space}
        tenant-mode: dedicated

  # ── HANA Cloud HDI Container ─────────────────────────────────────────────────
  # NOTA: crear la instancia de HANA Cloud y este servicio antes de desplegar
  - name: sap-presales-demos-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}
