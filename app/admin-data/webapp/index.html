<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAP Presales Admin - Datos Maestros</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"sap.presales.admin": "./"}'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
    ></script>
    <script>
        sap.ui.require(["sap/ui/core/Core"], function (Core) {
            Core.ready().then(function () {
                sap.ui.require(
                    ["sap/m/Shell", "sap/ui/core/ComponentContainer"],
                    function (Shell, ComponentContainer) {
                        new Shell({
                            app: new ComponentContainer({
                                height : "100%",
                                name   : "sap.presales.admin",
                                settings: { id: "sap.presales.admin" }
                            })
                        }).placeAt("content");
                    }
                );
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
